name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Installer Ninja
        shell: pwsh
        run: |
          pip install ninja
          $bin = python -c "import ninja; print(ninja.BIN_DIR)"
          Add-Content -Path $env:GITHUB_PATH -Value $bin

      - name: Compilateur MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Utiliser le vcpkg de la machine
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=C:\vcpkg"

      - name: Dossier triplets (requis par le preset)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path cmake

      - name: Configurer
        run: cmake --preset release

      - name: Compiler
        run: cmake --build build/release

      - name: Récupérer le DLL
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-dll
          path: build/release/*.dll

      - name: Afficher les logs (si échec)
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/release -Include *-out.log,*-err.log,vcpkg-manifest-install.log -ErrorAction SilentlyContinue |
            ForEach-Object { "===== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
