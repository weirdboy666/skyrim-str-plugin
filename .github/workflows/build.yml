name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - uses: actions/checkout@v4

      - name: Compilateur MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Installer Ninja
        run: choco install ninja -y --no-progress

      - name: Dossier triplets (requis par le preset)
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path cmake

      - name: Configurer
        run: cmake --preset release

      - name: Compiler
        run: cmake --build build/release

      - name: Récupérer le DLL
        uses: actions/upload-artifact@v4
        with:
          name: HelloWorld-dll
          path: build/release/*.dll

      - name: Logs vcpkg (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs
          path: C:\vcpkg\buildtrees\**\*.log
